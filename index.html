<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/script.js"></script>
    <title>ISBN Search</title>
</head>
<body>
    <main>
        <form>
            <h1>ISBN Search</h1>
            <label for="isbn">Enter the ISBN code:</label><br><br>
            <input type="text" name="isbn" id="isbn" placeholder="Example: 9788575222484">
            <br><br>
            <input type="button" name="search" id="search" value="Book Information">
        </form>

        <div id="resultError"></div>
        <div id="resultCountry"></div>
        <div id="resultPublisher"></div>
        <div id="resultTitle"></div>
    </main>
</body>
</html>
